name: TeddyCloud Next CI

on:
  pull_request:
    paths:
      - "next/**"
      - "docs/architecture/pi/pi-03-*.md"
      - "docs/architecture/pi/pi-05-*.md"
      - "docs/architecture/pi/pi-06-*.md"
      - ".github/workflows/next-ci.yml"
  push:
    branches:
      - master
      - develop
      - "docs/pi-*"
    paths:
      - "next/**"
      - "docs/architecture/pi/pi-03-*.md"
      - "docs/architecture/pi/pi-05-*.md"
      - "docs/architecture/pi/pi-06-*.md"
      - ".github/workflows/next-ci.yml"

permissions:
  contents: read

concurrency:
  group: next-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.1"
  NODE_VERSION: "24.21.0"
  PNPM_VERSION: "12.4.2"
  PYTHON_VERSION: "3.14.4"
  PNPM: "corepack pnpm"
  COREPACK_HOME: ${{ github.workspace }}/next/.cache/corepack
  PYTHONDONTWRITEBYTECODE: "1"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/next/.cache/ms-playwright

jobs:
  deterministic:
    name: Deterministic build and smoke checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            next/backend/go.mod
            next/tools/go.mod
            next/tools/go.sum
            next/go.work

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pnpm and Corepack downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            next/.cache/corepack
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('next/package.json', 'next/pnpm-lock.yaml') }}

      - name: Verify pinned pnpm through Corepack
        run: |
          corepack pnpm --version
          corepack pnpm config set store-dir "${RUNNER_TEMP}/pnpm-store"

      - name: Cache bundled Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: next/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('next/pnpm-lock.yaml') }}

      - name: Restore locked dependencies
        run: make -C next bootstrap

      - name: Install Playwright Chromium and host libraries
        working-directory: next
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run deterministic workspace gates
        run: make -C next check

      - name: Run pinned browser load smoke
        run: make -C next browser-smoke

      - name: Build and validate non-release artifact
        run: make -C next artifact artifact-check

      - name: Upload non-release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: teddycloud-next-${{ github.sha }}
          path: next/dist/artifact
          if-no-files-found: error
          retention-days: 7

  sqlite-persistence:
    name: Persistence and domain regression and race evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            next/backend/go.mod
            next/tools/go.mod
            next/tools/go.sum
            next/go.work

      - name: Run command-authored accounting boundaries once
        working-directory: next
        # Keep every exact/+1 assertion in these fixtures mandatory.
        # Fresh-process -race runs hit the unchanged catalog deadlines in the
        # byte cases and observation authoring; more package time cannot fix
        # that instrumentation overhead. The observation and event seeds are
        # expensive command-authored fixtures; neither is rebuilt ten times below.
        run: go test -count=1 -run '^TestSupersessionSQLiteCombined(WriterBytes|WriterObservations|WriterEvents|RegisterContentBytes)$' ./backend/internal/adapters/sqlite

      - name: Run focused SQLite regressions and repetition
        working-directory: next
        # Exclude only the observation and event tests explicitly covered above.
        # Every other SQLite test retains the full ten repetitions.
        run: |
          go test -skip '^TestSupersessionSQLiteCombinedWriter(Observations|Events)$' ./backend/internal/adapters/sqlite ./backend/internal/architecture
          go test ./backend/internal/domain/tag ./backend/internal/application/tagregistry
          go test -timeout=20m -count=10 -skip '^TestSupersessionSQLiteCombinedWriter(Observations|Events)$' ./backend/internal/adapters/sqlite

      - name: Run focused persistence and domain race evidence
        working-directory: next
        # Isolate only the four accounting-boundary fixtures run above.
        # All pre-existing SQLite and other-package race coverage stays intact;
        # -count=1 forces an uncached pass with the original package timeout.
        run: go test -count=1 -timeout=25m -race -skip '^TestSupersessionSQLiteCombined(WriterBytes|WriterObservations|WriterEvents|RegisterContentBytes)$' ./backend/internal/adapters/sqlite ./backend/internal/architecture ./backend/internal/domain/tag ./backend/internal/domain/content ./backend/internal/application/tagregistry ./backend/internal/testutil/taffixture ./backend/internal/adapters/contentfs

      - name: Require qualified Linux blob filesystem and repetition
        working-directory: next
        # Each test qualifies /var/tmp by descriptor mount ID, exact ext4/XFS
        # type and real syscall probes. An unqualified runner fails this job.
        run: go test -count=10 ./backend/internal/adapters/contentfs

      - name: Compile fail-closed non-Linux blob boundary
        working-directory: next
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go test -c -o "${RUNNER_TEMP}/contentfs-darwin.test" ./backend/internal/adapters/contentfs

  reproducibility:
    name: Two-work-directory reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            next/backend/go.mod
            next/tools/go.mod
            next/tools/go.sum
            next/go.work

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pnpm and Corepack downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            next/.cache/corepack
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('next/package.json', 'next/pnpm-lock.yaml') }}

      - name: Verify pinned pnpm through Corepack
        run: |
          corepack pnpm --version
          corepack pnpm config set store-dir "${RUNNER_TEMP}/pnpm-store"

      - name: Compare two fresh artifact builds
        run: make -C next reproducibility-check

  advisory:
    name: Network advisory checks
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            next/backend/go.mod
            next/tools/go.mod
            next/tools/go.sum
            next/go.work

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pnpm and Corepack downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            next/.cache/corepack
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('next/package.json', 'next/pnpm-lock.yaml') }}

      - name: Verify pinned pnpm through Corepack
        run: |
          corepack pnpm --version
          corepack pnpm config set store-dir "${RUNNER_TEMP}/pnpm-store"

      - name: Restore locked dependencies
        run: make -C next bootstrap

      - name: Query locked dependency advisories
        run: make -C next advisory
